spring:
  application:
    name: ${APP_NAME:supportdesk}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: ${JPA_SHOW_SQL:true}

    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

    cache:
      maximum-size: ${RATE_LIMIT_CACHE_MAXIMUM_SIZE:10000}
      expire-after-access: ${RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:30m}

    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
      refill-period: ${RATE_LIMIT_LOGIN_REFILL_PERIOD:1m}

    register:
      capacity: ${RATE_LIMIT_REGISTER_CAPACITY:3}
      refill-tokens: ${RATE_LIMIT_REGISTER_REFILL_TOKENS:3}
      refill-period: ${RATE_LIMIT_REGISTER_REFILL_PERIOD:10m}

    authenticated-read:
      capacity: ${RATE_LIMIT_READ_CAPACITY:120}
      refill-tokens: ${RATE_LIMIT_READ_REFILL_TOKENS:120}
      refill-period: ${RATE_LIMIT_READ_REFILL_PERIOD:1m}

    authenticated-write:
      capacity: ${RATE_LIMIT_WRITE_CAPACITY:30}
      refill-tokens: ${RATE_LIMIT_WRITE_REFILL_TOKENS:30}
      refill-period: ${RATE_LIMIT_WRITE_REFILL_PERIOD:1m}

    admin:
      capacity: ${RATE_LIMIT_ADMIN_CAPACITY:60}
      refill-tokens: ${RATE_LIMIT_ADMIN_REFILL_TOKENS:60}
      refill-period: ${RATE_LIMIT_ADMIN_REFILL_PERIOD:1m}

    anonymous:
      capacity: ${RATE_LIMIT_ANONYMOUS_CAPACITY:60}
      refill-tokens: ${RATE_LIMIT_ANONYMOUS_REFILL_TOKENS:60}
      refill-period: ${RATE_LIMIT_ANONYMOUS_REFILL_PERIOD:1m}