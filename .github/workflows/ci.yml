name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: supportdesk_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d supportdesk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/supportdesk_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: c3VwcG9ydGRlc2stY2ktand0LXNlY3JldC0zMi1ieXRlcy1taW5pbXVtIQ==
      JWT_EXPIRATION_SECONDS: 3600

      SERVER_PORT: 8080

      FLYWAY_ENABLED: true
      JPA_SHOW_SQL: false
      JPA_FORMAT_SQL: false

      RATE_LIMIT_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run full test suite
        run: >
          ./mvnw
          --batch-mode
          --no-transfer-progress
          clean
          verify

      - name: Build production Docker image
        run: >
          docker build
          --tag supportdesk:ci
          .
